<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vox Box FX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Sora:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a DJ hardware unit. Top deck = power, input, meters, master. Below = color-coded FX modules, stretcher spans wide. */
:root{
  --bg:#141118; --panel:#1f1a26; --panel-2:#28212f; --line:#3a3145; --fg:#f1ebf6; --mute:#9b90a8; --track:#2f2838;
  --c-phaser:#b48dff; --c-echo:#ffa24a; --c-delay:#3fdcd6; --c-reverb:#6fa8ff; --c-stretch:#ff5f8f;
  --ok:#5be38a; --warn:#ffcc4d; --hot:#ff4d5e;
  --f-display:"Bungee", "Arial Black", Impact, sans-serif;
  --f-body:"Sora", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{font:15px/1.45 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px;
  background:radial-gradient(1200px 500px at 50% -200px,#2a2033 0,transparent 70%),var(--bg);min-height:100vh}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,.dial:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
kbd{font:500 11px var(--f-mono);color:var(--mute);border:1px solid var(--line);border-radius:5px;padding:1px 6px}

/* Top deck */
.deck{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;grid-template-columns:auto 1fr auto;gap:16px 22px;align-items:center;
  box-shadow:0 1px 0 #ffffff0d inset,0 20px 40px -20px #000a}
.brand h1{font:400 30px/1 var(--f-display);margin:0;letter-spacing:.02em;background:linear-gradient(90deg,var(--c-phaser),var(--c-stretch) 45%,var(--c-echo));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand p{margin:4px 0 0;color:var(--mute);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.io{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;min-width:0}
.power{display:flex;align-items:center;gap:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:10px 18px 10px 12px;font-weight:700}
.power .led{width:14px;height:14px;border-radius:50%;background:#43394d;box-shadow:inset 0 1px 2px #0008}
.power[data-on="true"] .led{background:var(--ok);box-shadow:0 0 12px var(--ok)}
.power[data-on="paused"] .led{background:var(--warn);box-shadow:0 0 10px var(--warn)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 200px;max-width:320px}
.field label,.meters span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
select{background:var(--panel-2);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-size:14px;width:100%;min-width:0}
.meters{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;flex:1 1 180px;min-width:150px;max-width:300px}
.bar{height:10px;border-radius:5px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,var(--ok) 0 65%,var(--warn) 80%,var(--hot));background-size:var(--bw,300px) 100%;transition:width .05s linear}
.right{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.btn{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:9px 14px;font-weight:600;font-size:14px;display:inline-flex;gap:8px;align-items:center}
.btn:hover{border-color:#5a4d68}
.btn.rec[aria-pressed="true"]{background:var(--hot);border-color:var(--hot);color:#fff;animation:blink 1s steps(2) infinite}
.btn.panic{color:var(--hot)}
@keyframes blink{50%{opacity:.75}}
.status{margin:0;font-size:13px;color:var(--mute);min-height:1.4em}
.status b{color:var(--fg)}
.status.err{color:var(--hot)}

/* FX grid */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.card{--fxc:var(--c-phaser);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:14px;min-width:0;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:var(--fxc);opacity:.35;transition:opacity .2s}
.card.on::before{opacity:1;box-shadow:0 0 18px var(--fxc)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card-h h2{margin:0;font:400 16px var(--f-display);letter-spacing:.03em;color:var(--fxc)}
.card-h small{color:var(--mute);font-size:12px}
.pad{position:relative;border:1px solid var(--line);background:linear-gradient(180deg,var(--panel-2),#1b1621);border-radius:14px;height:78px;display:flex;align-items:center;justify-content:center;gap:10px;
  font:400 15px var(--f-display);letter-spacing:.06em;color:var(--mute);transition:all .12s;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.pad .dot{width:12px;height:12px;border-radius:50%;background:#42384c}
.pad:active{transform:translateY(1px)}
.pad[aria-pressed="true"]{color:#140f18;background:var(--fxc);border-color:var(--fxc);box-shadow:0 0 0 1px var(--fxc),0 0 28px -4px var(--fxc)}
.pad[aria-pressed="true"] .dot{background:#140f18}
.knobs{display:grid;grid-template-columns:repeat(auto-fit,minmax(54px,1fr));gap:10px 4px}
.knob{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.dial{--n:.5;width:52px;height:52px;border-radius:50%;position:relative;touch-action:none;cursor:ns-resize;
  background:conic-gradient(from 225deg,var(--fxc) calc(var(--n) * 270deg),var(--track) 0 270deg,transparent 0)}
.dial::after{content:"";position:absolute;inset:6px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3d3447,#221c29 70%);box-shadow:0 2px 6px #0009}
.dial i{position:absolute;left:50%;top:9px;width:3px;height:13px;margin-left:-1.5px;border-radius:2px;background:var(--fg);z-index:1;transform-origin:50% 17px}
.kl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.kv{font:500 12px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--fg);white-space:nowrap}
.mini{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{border-color:var(--fxc);color:var(--fxc)}
.top-knobs{display:flex;gap:10px}
.top-knobs .dial{--fxc:var(--fg);width:46px;height:46px}
.top-knobs .dial i{top:7px;height:11px;transform-origin:50% 16px}

/* Stretch */
.card.stretch{grid-column:span 4;--fxc:var(--c-stretch)}
.st-body{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,2fr) auto;gap:16px;align-items:stretch}
.hold{height:auto;min-height:120px;flex-direction:column;touch-action:none;font-size:16px}
.hold small{font:500 12px var(--f-body);letter-spacing:0;text-transform:none;opacity:.85}
.hold[data-state="rec"]{color:#fff;background:var(--hot);border-color:var(--hot);box-shadow:0 0 30px -4px var(--hot)}
.hold[data-state="play"]{color:#140f18;background:var(--fxc);border-color:var(--fxc)}
.wave{position:relative;background:#16121b;border:1px solid var(--line);border-radius:14px;min-height:120px;overflow:hidden}
.wave canvas{position:absolute;inset:0;width:100%;height:100%}
.wave .empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;color:var(--mute);font-size:13px}
.st-side{display:flex;flex-direction:column;gap:12px;min-width:0}
.st-side .knobs{grid-template-columns:repeat(3,64px)}

.takes{display:flex;flex-direction:column;gap:8px}
.takes:empty{display:none}
.take{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.take audio{height:34px;flex:1 1 220px;min-width:0}
.take a{color:var(--c-delay);font-weight:600}
.foot{color:var(--mute);font-size:12.5px;display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:space-between}
.foot span{display:inline-flex;gap:6px;align-items:center}

@media (max-width:980px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .card.stretch{grid-column:span 2}
  .deck{grid-template-columns:1fr}
  .right{justify-content:flex-start}
}
@media (max-width:640px){
  .grid{grid-template-columns:minmax(0,1fr)}
  .card.stretch{grid-column:auto}
  .st-body{grid-template-columns:minmax(0,1fr)}
  .st-side .knobs{grid-template-columns:repeat(3,minmax(0,1fr))}
  .brand h1{font-size:26px}
  .pad{height:66px}
  .foot .keys{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <header class="deck">
    <div class="brand">
      <h1>VOX BOX</h1>
      <p>Live voice FX deck</p>
    </div>
    <div class="io">
      <button class="power" id="power" data-on="false"><span class="led"></span><span id="powerTxt">Start mic</span></button>
      <div class="field">
        <label for="inputSel">Input</label>
        <select id="inputSel"><option value="">Default microphone</option></select>
      </div>
      <div class="meters" aria-hidden="true">
        <span>In</span><div class="bar"><i id="mIn"></i></div>
        <span>Out</span><div class="bar"><i id="mOut"></i></div>
      </div>
    </div>
    <div class="right">
      <div class="top-knobs" id="topKnobs"></div>
      <button class="btn rec" id="recBtn" aria-pressed="false">● Rec</button>
      <button class="btn panic" id="panicBtn" title="Turn every effect off and cut the tails (Esc)">Panic</button>
    </div>
  </header>

  <p class="status" id="status">Plug in your headphones, then press <b>Start mic</b>. Use headphones so the speakers don't feed back into the mic.</p>

  <main class="grid" id="grid"></main>

  <section class="takes" id="takes" aria-label="Recorded takes"></section>

  <footer class="foot">
    <span class="keys"><kbd>1</kbd>–<kbd>4</kbd> toggle effects · hold <kbd>Space</kbd> to grab for the stretcher · <kbd>Esc</kbd> panic · double-click a knob to reset</span>
    <span id="lat"></span>
  </footer>
</div>

<script>
/* ---------- Definitions ---------- */
const DIVS=[{l:'1/4',m:1},{l:'1/8D',m:.75},{l:'1/8',m:.5},{l:'1/8T',m:1/3},{l:'1/16',m:.25}];
const FX=[
  {id:'phaser',name:'Phaser',key:'1',sub:'swirl',knobs:[
    {p:'rate',label:'Rate',min:.05,max:6,def:.5,log:true,unit:' Hz',dp:2},
    {p:'depth',label:'Depth',min:0,max:1,def:.85,pct:true},
    {p:'fb',label:'Feedback',min:0,max:.85,def:.55,pct:true}]},
  {id:'echo',name:'Tape Echo',key:'2',sub:'slapback',knobs:[
    {p:'time',label:'Time',min:.05,max:.8,def:.22,unit:' ms',ms:true},
    {p:'repeats',label:'Repeats',min:0,max:.92,def:.45,pct:true},
    {p:'tone',label:'Tone',min:700,max:9000,def:2600,log:true,unit:' Hz',dp:0},
    {p:'mix',label:'Mix',min:0,max:1,def:.5,pct:true}]},
  {id:'delay',name:'Ping-Pong',key:'3',sub:'tempo delay',knobs:[
    {p:'bpm',label:'BPM',min:60,max:180,def:124,step:1,dp:0},
    {p:'div',label:'Note',steps:DIVS.map(d=>d.l),def:2},
    {p:'fb',label:'Feedback',min:0,max:.9,def:.45,pct:true},
    {p:'mix',label:'Mix',min:0,max:1,def:.45,pct:true}]},
  {id:'reverb',name:'Reverb',key:'4',sub:'space',knobs:[
    {p:'size',label:'Size',min:.4,max:9,def:2.8,log:true,unit:' s',dp:1},
    {p:'pre',label:'Pre-delay',min:0,max:.15,def:.02,unit:' ms',ms:true},
    {p:'mix',label:'Mix',min:0,max:1,def:.4,pct:true}]},
];
const ST_KNOBS=[
  {p:'speed',label:'Speed',min:0,max:2,def:.5,fmt:v=>v<.02?'FREEZE':'×'+v.toFixed(2)},
  {p:'pitch',label:'Pitch',min:-12,max:12,def:0,step:1,fmt:v=>(v>0?'+':'')+v+' st'},
  {p:'level',label:'Level',min:0,max:1.5,def:1,pct:true}];
const TOP_KNOBS=[
  {p:'mic',label:'Mic',min:0,max:4,def:1.2,pct:true},
  {p:'master',label:'Master',min:0,max:1.5,def:.9,pct:true}];

const P={stretch:{},top:{}}, ON={}, N={}, KNOB={};
FX.forEach(f=>{P[f.id]={};ON[f.id]=false;f.knobs.forEach(k=>P[f.id][k.p]=k.def)});
ST_KNOBS.forEach(k=>P.stretch[k.p]=k.def);
TOP_KNOBS.forEach(k=>P.top[k.p]=k.def);

const $=s=>document.querySelector(s);
const statusEl=$('#status');
function say(html,err){statusEl.innerHTML=html;statusEl.classList.toggle('err',!!err)}

/* ---------- Knob widget ---------- */
function fmt(d,v){
  if(d.fmt) return d.fmt(v);
  if(d.steps) return d.steps[v];
  if(d.pct) return Math.round(v*100)+'%';
  if(d.ms) return Math.round(v*1000)+' ms';
  return v.toFixed(d.dp??0)+(d.unit||'');
}
function makeKnob(d,onChange){
  const el=document.createElement('div');el.className='knob';
  el.innerHTML=`<div class="dial" tabindex="0" role="slider" aria-label="${d.label}"><i></i></div><span class="kl">${d.label}</span><span class="kv"></span>`;
  const dial=el.querySelector('.dial'),ind=el.querySelector('i'),kv=el.querySelector('.kv');
  const toN=v=>d.steps?v/(d.steps.length-1):d.log?Math.log(v/d.min)/Math.log(d.max/d.min):(v-d.min)/(d.max-d.min);
  const fromN=n=>{if(d.steps)return Math.round(n*(d.steps.length-1));let v=d.log?d.min*Math.pow(d.max/d.min,n):d.min+(d.max-d.min)*n;if(d.step)v=Math.round(v/d.step)*d.step;return v};
  let n=toN(d.def),raw=n,val=d.def;
  function set(nn,fire=true){
    n=Math.min(1,Math.max(0,nn));const v=fromN(n);if(d.steps||d.step)n=toN(v);
    dial.style.setProperty('--n',n);ind.style.transform=`rotate(${-135+270*n}deg)`;
    kv.textContent=fmt(d,v);dial.setAttribute('aria-valuetext',kv.textContent);
    if(v!==val||!fire){val=v;if(fire)onChange(v)}
  }
  set(n,false);
  let y0=null;
  dial.addEventListener('pointerdown',e=>{y0=e.clientY;raw=n;dial.setPointerCapture(e.pointerId);e.preventDefault()});
  dial.addEventListener('pointermove',e=>{if(y0===null)return;const s=e.shiftKey?600:170;raw=Math.min(1,Math.max(0,raw+(y0-e.clientY)/s));y0=e.clientY;set(raw)});
  const end=()=>{y0=null};dial.addEventListener('pointerup',end);dial.addEventListener('pointercancel',end);
  dial.addEventListener('dblclick',()=>set(toN(d.def)));
  dial.addEventListener('wheel',e=>{e.preventDefault();set(n+(e.deltaY<0?1:-1)*(d.steps?1/(d.steps.length-1):.02))},{passive:false});
  dial.addEventListener('keydown',e=>{
    const st=d.steps?1/(d.steps.length-1):d.step?d.step/(d.max-d.min):.02;
    if(e.key==='ArrowUp'||e.key==='ArrowRight'){set(n+st);e.preventDefault()}
    if(e.key==='ArrowDown'||e.key==='ArrowLeft'){set(n-st);e.preventDefault()}
  });
  return {el,setValue:v=>set(toN(v))};
}

/* ---------- Build UI ---------- */
const grid=$('#grid');
FX.forEach(f=>{
  const c=document.createElement('section');c.className='card';c.id='card-'+f.id;c.style.setProperty('--fxc',`var(--c-${f.id})`);
  c.innerHTML=`<div class="card-h"><h2>${f.name}</h2><small>${f.sub}</small></div>
    <button class="pad" aria-pressed="false" id="pad-${f.id}"><span class="dot"></span><span>${f.name}</span><kbd>${f.key}</kbd></button>
    <div class="knobs"></div>`;
  const kn=c.querySelector('.knobs');KNOB[f.id]={};
  f.knobs.forEach(k=>{const w=makeKnob(k,v=>{P[f.id][k.p]=v;apply(f.id)});KNOB[f.id][k.p]=w;kn.appendChild(w.el)});
  c.querySelector('.pad').addEventListener('click',()=>setFx(f.id,!ON[f.id]));
  if(f.id==='delay'){
    const m=document.createElement('div');m.className='mini';
    m.innerHTML=`<button class="chip" id="tapBtn">Tap tempo</button>`;c.appendChild(m);
  }
  grid.appendChild(c);
});
const sc=document.createElement('section');sc.className='card stretch';
sc.innerHTML=`<div class="card-h"><h2>Time Stretcher</h2><small>grab a phrase, then slow it, freeze it or flip it</small></div>
  <div class="st-body">
    <button class="pad hold" id="holdPad" data-state="idle"><span id="holdTxt">HOLD TO GRAB</span><small id="holdSub">Hold while you sing or talk (up to 12 s)</small></button>
    <div class="wave"><canvas id="wave"></canvas><div class="empty" id="waveEmpty">Your grabbed phrase shows up here. It plays back through all the effects above.</div></div>
    <div class="st-side"><div class="knobs" id="stKnobs"></div>
      <div class="mini"><button class="chip" id="playBtn" aria-pressed="false" disabled>Play</button><button class="chip" id="loopBtn" aria-pressed="true">Loop</button><button class="chip" id="revBtn" aria-pressed="false">Reverse</button></div>
    </div>
  </div>`;
grid.appendChild(sc);
ST_KNOBS.forEach(k=>$('#stKnobs').appendChild(makeKnob(k,v=>{P.stretch[k.p]=v;if(k.p==='level'&&ctx)ramp(S.out.gain,v)}).el));
TOP_KNOBS.forEach(k=>$('#topKnobs').appendChild(makeKnob(k,v=>{P.top[k.p]=v;applyTop()}).el));

function setFx(id,on){
  ON[id]=on;$('#pad-'+id).setAttribute('aria-pressed',on);$('#card-'+id).classList.toggle('on',on);apply(id);
}

/* ---------- Audio graph ---------- */
let ctx,inGain,thru,fxIn,comp,master,inAn,outAn,recDest,micStream,micSrc,cap,silent;
const G=(v=1)=>{const g=ctx.createGain();g.gain.value=v;return g};
function ramp(param,v,tc=.03){const t=ctx.currentTime;param.cancelScheduledValues(t);param.setTargetAtTime(v,t,tc)}
function satCurve(){const n=1024,c=new Float32Array(n);for(let i=0;i<n;i++){const x=i/(n-1)*2-1;c[i]=Math.tanh(x*1.4)/Math.tanh(1.4)}return c}

function buildPhaser(){
  const n={input:G(),output:G(),dry:G(1),wet:G(0)};
  n.input.connect(n.dry).connect(n.output);
  const entry=G();n.input.connect(entry);
  n.lfo=ctx.createOscillator();n.lfoAmt=G(850);n.lfo.connect(n.lfoAmt);
  let prev=entry;
  for(let i=0;i<6;i++){const f=ctx.createBiquadFilter();f.type='allpass';f.frequency.value=1000;f.Q.value=.6;n.lfoAmt.connect(f.frequency);prev.connect(f);prev=f}
  n.fb=G(.5);const fd=ctx.createDelay(.05);fd.delayTime.value=.002;prev.connect(fd).connect(n.fb).connect(entry);
  prev.connect(n.wet).connect(n.output);
  n.lfo.start();return n;
}
function buildEcho(){
  const n={input:G(),output:G(),send:G(0),wet:G(.5)};
  n.input.connect(n.output);
  n.d=ctx.createDelay(1.5);n.tone=ctx.createBiquadFilter();n.tone.type='lowpass';n.tone.Q.value=.5;
  const sat=ctx.createWaveShaper();sat.curve=satCurve();n.fb=G(.45);
  n.input.connect(n.send).connect(n.d);n.d.connect(n.tone);n.tone.connect(n.wet).connect(n.output);
  n.tone.connect(sat).connect(n.fb).connect(n.d);
  const fl=ctx.createOscillator();fl.frequency.value=.7;const fa=G(.0012);fl.connect(fa).connect(n.d.delayTime);fl.start();
  return n;
}
function buildDelay(){
  const n={input:G(),output:G(),send:G(0),wet:G(.45)};
  n.input.connect(n.output);
  n.dl=ctx.createDelay(2);n.dr=ctx.createDelay(2);n.fb=G(.45);
  const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=6000;
  const mg=ctx.createChannelMerger(2);
  n.input.connect(n.send).connect(n.dl);
  n.dl.connect(mg,0,0);n.dl.connect(n.dr);n.dr.connect(mg,0,1);
  n.dr.connect(lp).connect(n.fb).connect(n.dl);
  mg.connect(n.wet).connect(n.output);
  return n;
}
function makeIR(sec){
  const sr=ctx.sampleRate,len=Math.max(1,Math.floor(sr*sec)),b=ctx.createBuffer(2,len,sr);
  for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<len;i++){const t=i/len;d[i]=(Math.random()*2-1)*Math.pow(1-t,3.2)*(i<200?i/200:1)}}
  return b;
}
function buildReverb(){
  const n={input:G(),output:G(),send:G(0),wet:G(.4)};
  n.input.connect(n.output);
  const hp=ctx.createBiquadFilter();hp.type='highpass';hp.frequency.value=160;
  n.pre=ctx.createDelay(.5);n.conv=ctx.createConvolver();n.conv.buffer=makeIR(P.reverb.size);n.size=P.reverb.size;
  n.input.connect(n.send).connect(hp).connect(n.pre).connect(n.conv).connect(n.wet).connect(n.output);
  return n;
}
let irTimer;
function apply(id){
  if(!ctx)return;const p=P[id],on=ON[id],n=N[id];
  if(id==='phaser'){ramp(n.lfo.frequency,p.rate);ramp(n.fb.gain,p.fb);ramp(n.dry.gain,on?1-p.depth*.5:1);ramp(n.wet.gain,on?p.depth*.55:0)}
  if(id==='echo'){ramp(n.d.delayTime,p.time,.09);ramp(n.fb.gain,p.repeats);ramp(n.tone.frequency,p.tone);ramp(n.wet.gain,p.mix);ramp(n.send.gain,on?1:0,.01)}
  if(id==='delay'){const t=60/p.bpm*DIVS[p.div].m;ramp(n.dl.delayTime,t,.05);ramp(n.dr.delayTime,t,.05);ramp(n.fb.gain,p.fb);ramp(n.wet.gain,p.mix);ramp(n.send.gain,on?1:0,.01)}
  if(id==='reverb'){ramp(n.pre.delayTime,p.pre);ramp(n.wet.gain,p.mix*1.3);ramp(n.send.gain,on?1:0,.01);
    if(n.size!==p.size){clearTimeout(irTimer);irTimer=setTimeout(()=>{n.conv.buffer=makeIR(p.size);n.size=p.size},180)}}
}
function applyTop(){if(!ctx)return;ramp(inGain.gain,P.top.mic);ramp(master.gain,P.top.master)}

function buildGraph(){
  inGain=G(P.top.mic);thru=G(1);fxIn=G(1);silent=G(0);silent.connect(ctx.destination);
  inAn=ctx.createAnalyser();inAn.fftSize=1024;outAn=ctx.createAnalyser();outAn.fftSize=1024;
  inGain.connect(inAn);inGain.connect(thru).connect(fxIn);
  N.phaser=buildPhaser();N.echo=buildEcho();N.delay=buildDelay();N.reverb=buildReverb();
  fxIn.connect(N.phaser.input);N.phaser.output.connect(N.echo.input);N.echo.output.connect(N.delay.input);N.delay.output.connect(N.reverb.input);
  comp=ctx.createDynamicsCompressor();comp.threshold.value=-10;comp.knee.value=6;comp.ratio.value=8;comp.attack.value=.003;comp.release.value=.2;
  master=G(P.top.master);N.reverb.output.connect(comp).connect(master);
  master.connect(ctx.destination);master.connect(outAn);
  recDest=ctx.createMediaStreamDestination();master.connect(recDest);
  S.out=G(P.stretch.level);S.gate=G(0);S.gate.connect(S.out).connect(fxIn);
  FX.forEach(f=>apply(f.id));
}

/* ---------- Mic ---------- */
async function openMic(id){
  if(micStream)micStream.getTracks().forEach(t=>t.stop());
  if(micSrc)micSrc.disconnect();
  micStream=await navigator.mediaDevices.getUserMedia({audio:{deviceId:id?{exact:id}:undefined,echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  micSrc=ctx.createMediaStreamSource(micStream);micSrc.connect(inGain);
  const tr=micStream.getAudioTracks()[0];
  say(`Live from <b>${(tr&&tr.label)||'microphone'}</b>. Tap an effect pad and start talking.`);
  listDevices(tr&&tr.getSettings?tr.getSettings().deviceId:id);
}
async function listDevices(current){
  try{
    const devs=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='audioinput');
    const sel=$('#inputSel');sel.innerHTML='';
    devs.forEach((d,i)=>{const o=document.createElement('option');o.value=d.deviceId;o.textContent=d.label||('Microphone '+(i+1));sel.appendChild(o)});
    if(!devs.length)sel.innerHTML='<option value="">Default microphone</option>';
    if(current)sel.value=current;
  }catch(e){}
}
$('#inputSel').addEventListener('change',async e=>{if(!ctx)return;try{await openMic(e.target.value)}catch(err){micError(err)}});
if(navigator.mediaDevices&&navigator.mediaDevices.addEventListener)navigator.mediaDevices.addEventListener('devicechange',()=>{if(ctx)listDevices($('#inputSel').value)});

function micError(err){
  const name=err&&err.name;
  if(!window.isSecureContext)say('The mic only works when this page is opened over <b>https://</b> or from <b>localhost</b>.',true);
  else if(name==='NotAllowedError')say('Microphone access was blocked. Allow the microphone for this site in your browser settings, then press Start mic again.',true);
  else if(name==='NotFoundError'||name==='OverconstrainedError')say('No microphone found. Plug in your headset and pick it from the Input list.',true);
  else say('Could not open the mic: '+(err&&err.message||err),true);
}

/* ---------- Power ---------- */
const WORKLET=`class Cap extends AudioWorkletProcessor{constructor(){super();this.on=false;this.b=new Float32Array(2048);this.i=0;
this.port.onmessage=e=>{this.on=e.data;if(!e.data){if(this.i)this.port.postMessage(this.b.slice(0,this.i));this.i=0;this.port.postMessage('end')}}}
process(inp){const ch=inp[0]&&inp[0][0];if(this.on&&ch){for(let k=0;k<ch.length;k++){this.b[this.i++]=ch[k];if(this.i===2048){this.port.postMessage(this.b.slice(0));this.i=0}}}return true}}
registerProcessor('cap',Cap);`;

const power=$('#power');
power.addEventListener('click',async()=>{
  if(!ctx){
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){micError({});return}
    try{
      ctx=new (window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});
      await ctx.resume();buildGraph();
      await openMic($('#inputSel').value);
    }catch(err){micError(err);if(ctx){ctx.close();ctx=null}return}
    try{
      await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET],{type:'application/javascript'})));
      cap=new AudioWorkletNode(ctx,'cap');inGain.connect(cap);cap.connect(silent);cap.port.onmessage=onCap;
    }catch(e){$('#holdSub').textContent='This browser cannot capture audio for the stretcher.'}
    power.dataset.on='true';$('#powerTxt').textContent='Live';
    const lat=Math.round(((ctx.baseLatency||0)+(ctx.outputLatency||0))*1000);
    $('#lat').textContent=lat?`Output latency ≈ ${lat} ms · wired headphones feel tighter than Bluetooth`:'Wired headphones feel tighter than Bluetooth';
    requestAnimationFrame(loop);
  }else if(ctx.state==='running'){await ctx.suspend();power.dataset.on='paused';$('#powerTxt').textContent='Paused'}
  else{await ctx.resume();power.dataset.on='true';$('#powerTxt').textContent='Live'}
});

/* ---------- Time stretcher (granular) ---------- */
const S={state:'idle',chunks:[],len:0,buf:null,rev:null,pos:0,nextT:0,timer:null,loop:true,reverse:false,out:null,gate:null,peaks:null};
const HANN=(()=>{const n=128,a=new Float32Array(n);for(let i=0;i<n;i++)a[i]=.5*(1-Math.cos(2*Math.PI*i/(n-1)))*.5;return a})();
const holdPad=$('#holdPad'),holdTxt=$('#holdTxt'),holdSub=$('#holdSub'),playBtn=$('#playBtn');
function stUI(){
  holdPad.dataset.state=S.state==='wait'?'rec':S.state;
  if(S.state==='rec'||S.state==='wait'){holdTxt.textContent='GRABBING '+(S.len/ctx.sampleRate).toFixed(1)+' s';holdSub.textContent='Let go to play it back'}
  else if(S.state==='play'){holdTxt.textContent='PLAYING';holdSub.textContent='Hold again to grab a new phrase'}
  else{holdTxt.textContent='HOLD TO GRAB';holdSub.textContent=S.buf?'Hold to replace the phrase, or press Play':'Hold while you sing or talk (up to 12 s)'}
  playBtn.disabled=!S.buf;playBtn.textContent=S.state==='play'?'Stop':'Play';playBtn.setAttribute('aria-pressed',S.state==='play');
}
function grabStart(){
  if(!ctx){say('Press <b>Start mic</b> first.');return}
  if(!cap||S.state==='rec'||S.state==='wait')return;
  stopPlay();S.chunks=[];S.len=0;S.state='rec';cap.port.postMessage(true);stUI();
}
function grabEnd(){if(S.state!=='rec')return;S.state='wait';cap.port.postMessage(false);stUI()}
function onCap(e){
  if(e.data==='end'){finishGrab();return}
  if(S.state!=='rec'&&S.state!=='wait')return;
  S.chunks.push(e.data);S.len+=e.data.length;
  if(S.state==='rec'){stUI();if(S.len>ctx.sampleRate*12)grabEnd()}
}
function finishGrab(){
  if(S.state!=='wait')return;
  if(S.len<ctx.sampleRate*.25){S.state='idle';stUI();holdSub.textContent='Too short. Hold a bit longer.';return}
  const b=ctx.createBuffer(1,S.len,ctx.sampleRate),d=b.getChannelData(0);let o=0;
  S.chunks.forEach(c=>{d.set(c,o);o+=c.length});
  const r=ctx.createBuffer(1,S.len,ctx.sampleRate),rd=r.getChannelData(0);for(let i=0;i<S.len;i++)rd[i]=d[S.len-1-i];
  S.buf=b;S.rev=r;S.chunks=[];computePeaks();$('#waveEmpty').hidden=true;startPlay();
}
function startPlay(){
  if(!S.buf)return;clearInterval(S.timer);S.state='play';S.pos=0;S.nextT=ctx.currentTime+.03;
  ramp(S.gate.gain,1,.005);sched();S.timer=setInterval(sched,25);stUI();
}
function stopPlay(){
  clearInterval(S.timer);S.timer=null;if(ctx&&S.gate)ramp(S.gate.gain,0,.02);
  if(S.state==='play'){S.state='idle'}stUI();
}
function sched(){
  const grain=.09,hop=grain/4,rate=Math.pow(2,P.stretch.pitch/12),speed=P.stretch.speed;
  const buf=S.reverse?S.rev:S.buf,dur=buf.duration,need=Math.min(grain*rate,dur-.001);
  if(S.nextT<ctx.currentTime)S.nextT=ctx.currentTime+.01;
  while(S.nextT<ctx.currentTime+.15){
    if(S.pos+need>dur){if(S.loop)S.pos=0;else{stopPlay();return}}
    const off=Math.min(Math.max(0,S.pos+(Math.random()-.5)*.008),dur-need);
    const src=ctx.createBufferSource();src.buffer=buf;src.playbackRate.value=rate;
    const g=ctx.createGain();g.gain.value=0;g.gain.setValueCurveAtTime(HANN,S.nextT,grain);
    src.connect(g).connect(S.gate);src.start(S.nextT,off,need);
    S.pos+=hop*speed;S.nextT+=hop;
  }
}
holdPad.addEventListener('pointerdown',e=>{holdPad.setPointerCapture(e.pointerId);grabStart();e.preventDefault()});
holdPad.addEventListener('pointerup',grabEnd);holdPad.addEventListener('pointercancel',grabEnd);
holdPad.addEventListener('contextmenu',e=>e.preventDefault());
playBtn.addEventListener('click',()=>{if(!ctx)return;S.state==='play'?stopPlay():startPlay()});
$('#loopBtn').addEventListener('click',e=>{S.loop=!S.loop;e.currentTarget.setAttribute('aria-pressed',S.loop)});
$('#revBtn').addEventListener('click',e=>{S.reverse=!S.reverse;e.currentTarget.setAttribute('aria-pressed',S.reverse);if(S.buf)computePeaks()});

/* waveform */
const cv=$('#wave'),cx=cv.getContext('2d');
function computePeaks(){
  const d=(S.reverse?S.rev:S.buf).getChannelData(0),w=400,p=new Float32Array(w),step=Math.floor(d.length/w)||1;
  let mx=0.0001;for(let i=0;i<w;i++){let m=0;for(let j=i*step;j<Math.min(d.length,(i+1)*step);j++){const a=Math.abs(d[j]);if(a>m)m=a}p[i]=m;if(m>mx)mx=m}
  for(let i=0;i<w;i++)p[i]/=mx;S.peaks=p;
}
function drawWave(){
  const r=window.devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;
  if(cv.width!==Math.round(W*r)||cv.height!==Math.round(H*r)){cv.width=Math.round(W*r);cv.height=Math.round(H*r)}
  cx.setTransform(r,0,0,r,0,0);cx.clearRect(0,0,W,H);
  if(!S.peaks)return;
  const col=getComputedStyle(document.documentElement).getPropertyValue('--c-stretch').trim()||'#ff5f8f';
  const n=S.peaks.length,bw=W/n,head=S.buf?(S.pos/S.buf.duration):0;
  for(let i=0;i<n;i++){const h=Math.max(1,S.peaks[i]*(H*.42));cx.fillStyle=i/n<head&&S.state==='play'?col:'#5a4c66';cx.fillRect(i*bw,H/2-h,Math.max(1,bw-.5),h*2)}
  if(S.state==='play'){cx.fillStyle='#f1ebf6';cx.fillRect(head*W-1,0,2,H)}
}

/* ---------- Meters loop ---------- */
const tbuf=new Float32Array(1024);
function lvl(an){an.getFloatTimeDomainData(tbuf);let s=0;for(let i=0;i<tbuf.length;i++)s+=tbuf[i]*tbuf[i];const db=20*Math.log10(Math.sqrt(s/tbuf.length)+1e-9);return Math.max(0,Math.min(1,(db+60)/60))}
const mIn=$('#mIn'),mOut=$('#mOut');
function loop(){
  if(ctx){mIn.style.width=(lvl(inAn)*100)+'%';mOut.style.width=(lvl(outAn)*100)+'%';
    const bw=mIn.parentElement.clientWidth+'px';mIn.style.setProperty('--bw',bw);mOut.style.setProperty('--bw',bw)}
  drawWave();requestAnimationFrame(loop);
}
window.addEventListener('resize',drawWave);

/* ---------- Tap tempo ---------- */
let taps=[];
$('#tapBtn').addEventListener('click',()=>{
  const t=performance.now();if(taps.length&&t-taps[taps.length-1]>2000)taps=[];taps.push(t);taps=taps.slice(-5);
  if(taps.length>1){const avg=(taps[taps.length-1]-taps[0])/(taps.length-1);KNOB.delay.bpm.setValue(Math.min(180,Math.max(60,Math.round(60000/avg))))}
});

/* ---------- Panic ---------- */
function panic(){
  FX.forEach(f=>setFx(f.id,false));stopPlay();
  if(!ctx)return;
  ['echo','delay'].forEach(id=>{ramp(N[id].fb.gain,0,.01);ramp(N[id].wet.gain,0,.01)});ramp(N.reverb.wet.gain,0,.01);
  setTimeout(()=>FX.forEach(f=>apply(f.id)),900);
  say('Everything off. Tails cut.');
}
$('#panicBtn').addEventListener('click',panic);

/* ---------- Record output ---------- */
let rec=null,recChunks=[],recT0=0,takeN=0;
const recBtn=$('#recBtn');
recBtn.addEventListener('click',()=>{
  if(!ctx){say('Press <b>Start mic</b> first, then hit Rec to record what you hear.');return}
  if(!window.MediaRecorder){say('This browser cannot record audio.',true);return}
  if(rec&&rec.state==='recording'){rec.stop();return}
  const mime=['audio/webm;codecs=opus','audio/mp4','audio/webm'].find(m=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m));
  rec=new MediaRecorder(recDest.stream,mime?{mimeType:mime}:undefined);recChunks=[];
  rec.ondataavailable=e=>{if(e.data.size)recChunks.push(e.data)};
  rec.onstop=()=>{
    recBtn.setAttribute('aria-pressed','false');recBtn.textContent='● Rec';
    const type=rec.mimeType||mime||'audio/webm',blob=new Blob(recChunks,{type}),url=URL.createObjectURL(blob);
    const secs=Math.round((performance.now()-recT0)/1000),ext=type.includes('mp4')?'m4a':'webm';takeN++;
    const row=document.createElement('div');row.className='take';
    row.innerHTML=`<strong>Take ${takeN}</strong><span class="kv">${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}</span><audio controls src="${url}"></audio><a href="${url}" download="vox-box-take-${takeN}.${ext}">Save file</a>`;
    $('#takes').prepend(row);
  };
  rec.start();recT0=performance.now();recBtn.setAttribute('aria-pressed','true');recBtn.textContent='■ Stop';
});

/* ---------- Keyboard ---------- */
document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();if(tag==='select'||tag==='input')return;
  const f=FX.find(x=>x.key===e.key);if(f){setFx(f.id,!ON[f.id]);return}
  if(e.code==='Space'&&!e.repeat&&!e.target.classList.contains('dial')){e.preventDefault();grabStart()}
  if(e.key==='Escape')panic();
});
document.addEventListener('keyup',e=>{if(e.code==='Space')grabEnd()});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.repeat)e.preventDefault()});
stUI();drawWave();
</script>
</body>
</html>
